<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <title>ChipStock - Hostel Chips & Snacks</title>
    <meta name="description" content="Mobile-first inventory management and billing system for hostel chips & snacks." />
    
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F59E0B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ChipStock" />
    
    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/chip-icon.svg" />
    <link rel="apple-touch-icon" href="/chip-icon.svg" />
    
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F8F9FA] text-zinc-900 antialiased selection:bg-amber-100 selection:text-amber-900 select-none overscroll-none">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => {
              console.log('ChipStock SW registered:', reg.scope);
            },
            (err) => {
              console.log('ChipStock SW registration failed:', err);
            }
          );
        });
      }
    </script>
  </body>
</html>
